<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Toot Town</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#87d7ff;font-family:system-ui,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}.help{position:fixed;left:12px;bottom:10px;background:#fff9;padding:8px 12px;border-radius:14px;font-weight:800;color:#472531;box-shadow:0 3px 12px #0003;user-select:none}.btn{position:fixed;right:18px;bottom:18px;width:92px;height:92px;border:0;border-radius:50%;background:#79df55;color:#173c10;font-size:20px;font-weight:1000;box-shadow:0 7px 0 #3e9d31;touch-action:none}.btn:active{transform:translateY(5px);box-shadow:0 2px 0 #3e9d31}
.move{position:fixed;left:18px;bottom:62px;display:flex;gap:12px}.move button{width:72px;height:72px;border:0;border-radius:22px;background:#ffffffcc;font-size:30px;font-weight:900;box-shadow:0 5px 0 #8ab1c2;touch-action:none;user-select:none}@media(max-width:700px){.help{display:none}.btn{width:86px;height:86px}.move{bottom:25px}}</style></head>
<body><canvas id="g"></canvas><div class="move"><button id="left">◀</button><button id="right">▶</button></div><div class="help">← → / A D move · SPACE to TOOT · R restart</div><button class="btn" id="toot">💨 TOOT</button>
<script>
const c=document.querySelector('#g'),x=c.getContext('2d'); let W,H,ground;
function resize(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);W=innerWidth;H=innerHeight;ground=H-95} addEventListener('resize',resize);resize();
let keys={},pig,beans,rocks,clouds,score,over,particles,last=0,spawn=0;
function scores(){try{return JSON.parse(localStorage.getItem('tootTownScores')||'[]')}catch(e){return []}}
function saveScore(n){let a=scores();a.push(n);a=a.sort((a,b)=>b-a).slice(0,5);localStorage.setItem('tootTownScores',JSON.stringify(a))}
function reset(){pig={x:130,y:ground-48,vx:0,vy:0,r:28,face:1};beans=[];rocks=[];particles=[];clouds=Array.from({length:6},(_,i)=>({x:i*260+80,y:50+Math.random()*130,s:.7+Math.random()}));score=0;over=false;spawn=0}reset();
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.code==='Space'){e.preventDefault();toot()}if(e.key.toLowerCase()==='r')reset()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
document.querySelector('#toot').onpointerdown=e=>{e.preventDefault();toot()};for(const [id,key] of [['left','arrowleft'],['right','arrowright']]){let b=document.querySelector('#'+id);b.onpointerdown=e=>{e.preventDefault();keys[key]=1};b.onpointerup=b.onpointercancel=e=>{keys[key]=0}}
let AC,audioOn=true,musicTimer=null,musicStep=0;
function audio(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();startMusic();return AC}
function tone(freq,dur=.12,type='square',vol=.045,when=0){if(!audioOn)return;let a=audio(),o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,a.currentTime+when);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+when+dur);o.connect(g);g.connect(a.destination);o.start(a.currentTime+when);o.stop(a.currentTime+when+dur)}
const fartNames=['PFFFT','SQUEAKER','RUMBLER','WET ONE','TURBO TOOT'];
function fart(){if(!audioOn)return;let a=audio(),kind=Math.floor(Math.random()*5),dur=[.18,.12,.42,.32,.25][kind],cut=[220,520,125,170,280][kind],gain=[.20,.13,.26,.22,.24][kind];
 let len=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,len,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++){let t=i/len,n=Math.random()*2-1;d[i]=n*(1-t)*(kind===1?.5+Math.sin(i*.09)*.5:1)}
 let n=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();n.buffer=b;f.type=kind===1?'bandpass':'lowpass';f.frequency.value=cut;g.gain.value=gain;n.connect(f);f.connect(g);g.connect(a.destination);n.playbackRate.value=[1,1.7,.72,.85,1.2][kind];n.start();
 if(kind===4){tone(95,.18,'sawtooth',.035);tone(65,.24,'square',.025,.08)}
 fartLabel=fartNames[kind];fartLabelLife=55;
}
let fartLabel='',fartLabelLife=0;
function collectSound(){tone(660,.08,'sine',.07);tone(880,.11,'sine',.06,.07)}
function crashSound(){tone(120,.35,'sawtooth',.09);tone(70,.5,'square',.05,.04)}
function startMusic(){if(musicTimer||!audioOn)return;let notes=[262,330,392,330,294,349,440,349];musicTimer=setInterval(()=>{if(!over&&audioOn){tone(notes[musicStep++%notes.length],.16,'triangle',.018)}},240)}
function toot(){audio();if(over){reset();return}fart();pig.vy-=7.3;pig.vx+=pig.face*1.7;for(let i=0;i<14;i++)particles.push({x:pig.x-pig.face*25,y:pig.y+9,vx:-pig.face*(2+Math.random()*4),vy:(Math.random()-.5)*2,r:5+Math.random()*9,a:1})}
function circleRect(px,py,r,o){let nx=Math.max(o.x,Math.min(px,o.x+o.w)),ny=Math.max(o.y,Math.min(py,o.y+o.h));return (px-nx)**2+(py-ny)**2<r*r}
function update(dt){if(over)return;let m=(keys.arrowright||keys.d?1:0)-(keys.arrowleft||keys.a?1:0);if(m)pig.face=m;pig.vx+=m*.42;pig.vx*=.94;pig.vy+=.38;pig.x+=pig.vx;pig.y+=pig.vy;if(pig.y>ground-pig.r){pig.y=ground-pig.r;pig.vy=0}pig.x=Math.max(30,Math.min(W-30,pig.x));score+=dt*.006;spawn+=dt;if(spawn>900){spawn=0;let isBean=Math.random()<.62;(isBean?beans:rocks).push(isBean?{x:W+20,y:ground-30-Math.random()*120,r:14}:{x:W+20,y:ground-30,w:38,h:30})}
for(const a of [...beans,...rocks])a.x-=4+score/300;beans=beans.filter(b=>{if(Math.hypot(pig.x-b.x,pig.y-b.y)<pig.r+b.r){score+=25;collectSound();return false}return b.x>-50});rocks=rocks.filter(r=>{if(circleRect(pig.x,pig.y,pig.r,r)){if(!over){over=true;crashSound();saveScore(Math.floor(score))}}return r.x>-60});for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.a-=.025;p.r+=.2}particles=particles.filter(p=>p.a>0)}
function cloud(q){x.fillStyle='#fff';x.beginPath();x.arc(q.x,q.y,28*q.s,0,7);x.arc(q.x+30*q.s,q.y+6,23*q.s,0,7);x.arc(q.x-27*q.s,q.y+7,20*q.s,0,7);x.fill()}
function drawPig(){x.save();x.translate(pig.x,pig.y);if(pig.face<0)x.scale(-1,1);x.fillStyle='#ef87a7';x.beginPath();x.arc(0,0,29,0,7);x.fill();x.beginPath();x.moveTo(-16,-21);x.lineTo(-25,-42);x.lineTo(-4,-27);x.fill();x.fillStyle='#f6a4bd';x.beginPath();x.ellipse(20,5,17,13,0,0,7);x.fill();x.fillStyle='#572938';x.beginPath();x.arc(25,1,2.5,0,7);x.arc(25,9,2.5,0,7);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(8,-9,7,0,7);x.fill();x.fillStyle='#111';x.beginPath();x.arc(11,-9,3,0,7);x.fill();x.fillStyle='#7a4152';x.fillRect(-16,22,7,15);x.fillRect(7,22,7,15);x.restore()}
function draw(){x.clearRect(0,0,W,H);let sky=x.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#70cfff');sky.addColorStop(1,'#d8f6ff');x.fillStyle=sky;x.fillRect(0,0,W,H);clouds.forEach(cloud);x.fillStyle='#79bd52';x.beginPath();x.moveTo(0,ground);for(let i=0;i<=W;i+=80)x.quadraticCurveTo(i+40,ground-70-(i%160),i+80,ground);x.lineTo(W,H);x.lineTo(0,H);x.fill();x.fillStyle='#50a83e';x.fillRect(0,ground,W,H-ground);
for(const p of particles){x.globalAlpha=p.a;x.fillStyle='#79d85e';x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill()}x.globalAlpha=1;for(const b of beans){x.fillStyle='#ffe15d';x.beginPath();x.ellipse(b.x,b.y,10,15,.6,0,7);x.fill();x.strokeStyle='#9a7221';x.lineWidth=3;x.stroke()}for(const r of rocks){x.fillStyle='#704c40';x.beginPath();x.roundRect(r.x,r.y,r.w,r.h,8);x.fill()}drawPig();if(fartLabelLife>0){fartLabelLife--;x.save();x.globalAlpha=Math.min(1,fartLabelLife/15);x.textAlign='center';x.fillStyle='#3c7e25';x.font='900 18px system-ui';x.fillText(fartLabel,pig.x,pig.y-48);x.restore()}x.fillStyle='#472531';x.font='900 38px system-ui';x.fillText('TOOT TOWN',22,48);x.font='800 20px system-ui';x.fillText('Score: '+Math.floor(score),24,76);x.fillText('🫘 +25',24,102);let hs=scores()[0]||0;x.fillText('High: '+hs,24,128);if(over){x.fillStyle='#000b';x.fillRect(0,0,W,H);x.textAlign='center';x.fillStyle='white';x.font='900 48px system-ui';x.fillText('TOOTED OUT!',W/2,Math.max(90,H/2-150));x.font='800 24px system-ui';x.fillText('Score: '+Math.floor(score),W/2,Math.max(125,H/2-110));x.font='900 26px system-ui';x.fillText('🏆 HIGH SCORES',W/2,Math.max(175,H/2-60));let a=scores();x.font='800 21px system-ui';for(let i=0;i<5;i++)x.fillText((i+1)+'.  '+(a[i]??'---'),W/2,Math.max(210,H/2-25)+i*29);x.font='700 18px system-ui';x.fillText('Tap TOOT or press R to play again',W/2,Math.min(H-35,Math.max(390,H/2+155)));x.textAlign='left'}}
document.querySelector('#sound').onpointerdown=e=>{e.preventDefault();audioOn=!audioOn;e.currentTarget.textContent=audioOn?'🔊':'🔇';if(audioOn){audio();startMusic()}else if(musicTimer){clearInterval(musicTimer);musicTimer=null}};
addEventListener('pointerdown',()=>audio(),{once:true});
function loop(t){let dt=Math.min(32,t-last||16);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script><button id="sound" style="position:fixed;right:18px;top:18px;border:0;border-radius:16px;padding:10px 14px;background:#fffC;font-size:20px;font-weight:900;z-index:5">🔊</button></body></html>
